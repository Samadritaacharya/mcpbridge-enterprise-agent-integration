[project]
name = "mcpbridge-enterprise-agent-integration"
version = "0.2.0"
description = "Enterprise MCP integration gateway with policy, human approval, auditability, and LangGraph orchestration."
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=2,<3",
  "langgraph>=0.6,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
