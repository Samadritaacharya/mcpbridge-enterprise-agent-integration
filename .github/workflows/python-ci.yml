name: Python CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Python verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests app.py api.py mcp_server.py
      - name: Compile
        run: python -m compileall -q src tests app.py api.py mcp_server.py
      - name: Unit and integration tests
        env:
          MCPBRIDGE_APPROVAL_SECRET: ci-secret-not-production
        run: pytest
      - name: Combined ASGI import smoke
        run: python -c "from app import app; print(app.title)"
      - name: Real Streamable HTTP MCP end-to-end
        env:
          MCPBRIDGE_APPROVAL_SECRET: ci-secret-not-production
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8765 > /tmp/mcpbridge-uvicorn.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/mcpbridge-uvicorn.log' EXIT
          python - <<'PY'
          import asyncio
          import json
          import time
          import urllib.request
          from mcp import Client
          from mcp.types import TextResourceContents

          BASE = "http://127.0.0.1:8765"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(BASE + "/gateway/health", timeout=1) as response:
                      health = json.load(response)
                  if health.get("ok"):
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError("MCPBridge HTTP server did not become ready")

          async def main():
              async with Client(BASE + "/mcp/", raise_exceptions=True) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  assert {"get_incident", "get_repository_status", "compare_suppliers"}.issubset(names)
                  assert "create_change_request" not in names
                  assert "create_github_issue" not in names
                  assert "create_incident" not in names
                  assert str(client.protocol_version) == "2026-07-28"

                  incident = await client.call_tool("get_incident", {"incident_id": "INC-428"})
                  assert incident.is_error is False
                  assert incident.structured_content is not None
                  assert incident.structured_content["id"] == "INC-428"

                  repository = await client.call_tool(
                      "get_repository_status", {"repo": "payments-api"}
                  )
                  assert repository.is_error is False
                  assert repository.structured_content is not None
                  assert repository.structured_content["name"] == "payments-api"
                  assert repository.structured_content["ci"] == "degraded"

                  comparison = await client.call_tool(
                      "compare_suppliers", {"left": "SUP-ALPHA", "right": "SUP-BETA"}
                  )
                  assert comparison.is_error is False
                  assert comparison.structured_content is not None
                  assert comparison.structured_content["left"]["id"] == "SUP-ALPHA"
                  assert comparison.structured_content["right"]["id"] == "SUP-BETA"

                  resources = await client.list_resource_templates()
                  assert any(
                      item.uri_template == "incident://{incident_id}"
                      for item in resources.resource_templates
                  )
                  resource = await client.read_resource("incident://INC-428")
                  assert isinstance(resource.contents[0], TextResourceContents)
                  assert "INC-428" in resource.contents[0].text

                  prompts = await client.list_prompts()
                  assert any(item.name == "change_risk_review" for item in prompts.prompts)
                  prompt = await client.get_prompt(
                      "change_risk_review", {"service": "payments-api"}
                  )
                  assert prompt.messages

          asyncio.run(main())
          print("Real Streamable HTTP MCP full public-surface smoke passed")
          PY
      - name: Docker build
        run: docker build -t mcpbridge-ci .
