name: Python CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Python verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests app.py api.py mcp_server.py
      - name: Compile
        run: python -m compileall -q src tests app.py api.py mcp_server.py
      - name: Unit and integration tests
        env:
          MCPBRIDGE_APPROVAL_SECRET: ci-secret-not-production
        run: pytest
      - name: Combined ASGI import smoke
        run: python -c "from app import app; print(app.title)"
      - name: Docker build
        run: docker build -t mcpbridge-ci .
