name: Web CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Web verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install web
        run: npm install
      - name: Install Python backend for connected E2E
        working-directory: .
        run: pip install -e .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:web
      - name: Production build
        run: npm run build
      - name: Production server end-to-end smoke
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/mcpbridge-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/mcpbridge-web.log' EXIT
          node - <<'JS'
          const base = 'http://127.0.0.1:3000';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function json(path, init) {
            const response = await fetch(base + path, init);
            const body = await response.json();
            if (!response.ok) throw new Error(`${path} failed (${response.status}): ${JSON.stringify(body)}`);
            return {response, body};
          }

          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              const response = await fetch(base + '/api/health');
              if (response.ok) break;
            } catch {}
            if (attempt === 39) throw new Error('Next.js production server did not become ready');
            await sleep(250);
          }

          const root = await fetch(base + '/');
          const html = await root.text();
          if (!root.ok || !html.includes('MCPBridge')) throw new Error('portfolio root page smoke failed');

          const health = await json('/api/health');
          if (health.body.runtime_mode !== 'deterministic-public-demo') throw new Error('unexpected runtime mode');
          if (health.body.protocol_target !== '2026-07-28') throw new Error('unexpected protocol target');

          const catalog = await json('/api/catalog');
          const serverNames = Object.keys(catalog.body.servers || {}).sort();
          if (serverNames.join(',') !== 'business,github,itsm') throw new Error('catalog server set mismatch');

          const read = await json('/api/execute', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              role: 'viewer',
              server: 'itsm',
              tool: 'get_incident',
              arguments: {incident_id: 'INC-428'},
            }),
          });
          if (read.body.status !== 'completed' || read.body.result?.id !== 'INC-428') {
            throw new Error('web read execution smoke failed');
          }

          const proposal = await json('/api/execute', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              role: 'operator',
              server: 'itsm',
              tool: 'create_change_request',
              arguments: {
                service: 'payments-api',
                summary: 'Web production smoke',
                risk: 'low',
                implementation_window: 'approved test window',
              },
            }),
          });
          if (proposal.body.status !== 'approval_required' || !proposal.body.approval_token) {
            throw new Error('web approval proposal smoke failed');
          }

          const approved = await json('/api/approve', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              role: 'approver',
              approval_token: proposal.body.approval_token,
              decision: 'approve',
            }),
          });
          if (approved.body.status !== 'completed' || approved.body.result?.status !== 'created') {
            throw new Error('web approval execution smoke failed');
          }

          console.log('Next.js deterministic production end-to-end smoke passed');
          JS
      - name: Connected Python + Next.js end-to-end smoke
        env:
          MCPBRIDGE_APPROVAL_SECRET: ci-secret-not-production
          MCPBRIDGE_API_URL: http://127.0.0.1:8765/gateway
        run: |
          cd ..
          uvicorn app:app --host 127.0.0.1 --port 8765 > /tmp/mcpbridge-python.log 2>&1 &
          PYTHON_PID=$!
          cd frontend
          npm start -- --hostname 127.0.0.1 --port 3001 > /tmp/mcpbridge-connected-web.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill $WEB_PID 2>/dev/null || true
            kill $PYTHON_PID 2>/dev/null || true
            cat /tmp/mcpbridge-connected-web.log
            cat /tmp/mcpbridge-python.log
          }
          trap cleanup EXIT
          node - <<'JS'
          const web = 'http://127.0.0.1:3001';
          const backend = 'http://127.0.0.1:8765';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(url, label) {
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                const response = await fetch(url);
                if (response.ok) return;
              } catch {}
              if (attempt === 59) throw new Error(`${label} did not become ready`);
              await sleep(250);
            }
          }

          async function json(path, init) {
            const response = await fetch(web + path, init);
            const body = await response.json();
            if (!response.ok) throw new Error(`${path} failed (${response.status}): ${JSON.stringify(body)}`);
            return {response, body};
          }

          await waitFor(backend + '/gateway/health', 'Python gateway');
          await waitFor(web + '/api/health', 'connected Next.js server');

          const health = await json('/api/health');
          if (health.body.runtime_mode !== 'connected-python-mcp' || health.body.backend_configured !== true) {
            throw new Error(`connected runtime mode mismatch: ${JSON.stringify(health.body)}`);
          }

          const catalog = await json('/api/catalog');
          const serverNames = Object.keys(catalog.body.servers || {}).sort();
          if (serverNames.join(',') !== 'business,github,itsm') throw new Error('connected catalog mismatch');

          const agent = await json('/api/agent', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              role: 'operator',
              request: 'Show me incident INC-428 and its current status.',
            }),
          });
          if (agent.body.status !== 'completed' || agent.body.plan?.tool !== 'get_incident' || agent.body.result?.id !== 'INC-428') {
            throw new Error(`connected agent read failed: ${JSON.stringify(agent.body)}`);
          }

          const proposal = await json('/api/execute', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              role: 'operator',
              server: 'itsm',
              tool: 'create_change_request',
              arguments: {
                service: 'payments-api',
                summary: 'Connected full-stack deployment-readiness smoke',
                risk: 'low',
                implementation_window: 'approved test window',
              },
            }),
          });
          if (proposal.body.status !== 'approval_required' || !proposal.body.approval_token) {
            throw new Error(`connected proposal failed: ${JSON.stringify(proposal.body)}`);
          }

          const approved = await json('/api/approve', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({
              role: 'approver',
              approval_token: proposal.body.approval_token,
              decision: 'approve',
            }),
          });
          if (approved.body.status !== 'completed' || approved.body.result?.status !== 'created' || approved.body.result?.synthetic !== true) {
            throw new Error(`connected approval failed: ${JSON.stringify(approved.body)}`);
          }

          const audit = await json('/api/audit');
          if (audit.body.chain_valid !== true || !Array.isArray(audit.body.events) || audit.body.events.length < 3) {
            throw new Error(`connected audit verification failed: ${JSON.stringify(audit.body)}`);
          }

          console.log('Next.js -> Python gateway -> MCP connected full-stack smoke passed');
          JS
